name: Force Threads playback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-threads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch threads.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/threads.js')
          s = p.read_text()
          old = 'window.matchMedia?.(\"(prefers-reduced-motion: reduce)\").matches??!1'
          if old not in s:
              print('pattern not found or already patched')
              raise SystemExit(0)
          s = s.replace(old, '!1', 1)
          p.write_text(s)
          print('patched')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/threads.js
          git diff --cached --quiet || git commit -m "fix: force threads playback"
          git push
